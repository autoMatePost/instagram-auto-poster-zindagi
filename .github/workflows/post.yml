
name: Zindagi Instagram Poster

on:
  schedule:
    - cron: "30 10 * * *"

  workflow_dispatch:
    inputs:
      post_count:
        description: "Manual run count (blank = use DAILY_POST_COUNT; ALL = all pending)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: zindagi-instagram-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post scheduled Reels
        env:
          ZINDAGI_ACCESS_TOKEN: ${{ secrets.ZINDAGI_ACCESS_TOKEN }}
          ZINDAGI_USER_ID: ${{ secrets.ZINDAGI_USER_ID }}
          DAILY_POST_COUNT: ${{ vars.DAILY_POST_COUNT }}
          MANUAL_POST_COUNT: ${{ inputs.post_count }}
          MAX_TOTAL_POSTS: "70"
          MIN_GAP_SECONDS: "120"
          MAX_GAP_SECONDS: "360"
        run: python post_to_instagram.py

      - name: Save links, state and remove posted videos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A images state.json links.txt

          if ! git diff --cached --quiet; then
            git commit -m "Save Reel links, state and remove posted videos"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to save."
          fi
