name: Zindagi Instagram Poster

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Post Reels
        env:
          ZINDAGI_ACCESS_TOKEN: ${{ secrets.ZINDAGI_ACCESS_TOKEN }}
          ZINDAGI_USER_ID: ${{ secrets.ZINDAGI_USER_ID }}
        run: |
          python post_to_instagram.py

      - name: Save Reel links and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json links.txt

          git diff --cached --quiet || git commit -m "Save Reel links and posting state"

          git push
